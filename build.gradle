plugins {
    id 'java'
    // Same versions as the sdg root build (BOOT-01, ADR-0065): inside that build the plugins are already on
    // the classpath, and Gradle refuses a second version of a plugin there.
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.0.1'
}

group = 'com.dlap'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4 name of the Spring MVC starter (spring-boot-starter-web is deprecated there).
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}

node {
    // Node 22.x LTS: required floor for the Vite 6 + Vitest 4 toolchain.
    // Node 20.10.0 predates stable require()-of-ESM, so jsdom's ESM-only
    // transitive deps break `vitest run` (ERR_REQUIRE_ESM) under it.
    // One exact release for the Gradle build and the UI workflow (Q-545): the node-version of
    // .github/workflows/ui-ci.yml must equal this line, and frontend/src/buildToolchain.test.ts fails when it does not.
    version = '22.23.3'
    npmVersion = '10.9.0'
    download = true
    workDir = file("${project.buildDir}/nodejs")
    npmWorkDir = file("${project.buildDir}/npm")
}

task deleteOldSubframeApp(type: Delete) {
    delete 'subframe-cursor-app'
    // Set followSymlinks to true to ensure we delete all files
    followSymlinks = true
    // Only if the directory exists
    onlyIf { file('subframe-cursor-app').exists() }
}

task installFrontendDeps(type: NpmTask) {
    description = 'Install frontend dependencies'
    args = ['install']
    workingDir = file('frontend')
}

task setupSubframe(type: NpmTask) {
    description = 'Setup Subframe for the project'
    dependsOn installFrontendDeps
    args = ['install', '@subframe/core@latest']
    workingDir = file('frontend')
}

task syncSubframeComponents(type: NpmTask) {
    description = 'Sync Subframe components'
    dependsOn setupSubframe
    args = ['exec', '@subframe/cli@latest', 'sync', '--all']
    workingDir = file('frontend')
}

task buildFrontend(type: NpmTask) {
    description = 'Build frontend'
    dependsOn installFrontendDeps
    args = ['run', 'build']
    workingDir = file('frontend')
}

task frontendTest(type: NpmTask) {
    description = 'Run frontend tests'
    dependsOn installFrontendDeps
    args = ['run', 'test:ci']
    workingDir = file('frontend')
}

processResources {
    dependsOn buildFrontend
    from('frontend/build') {
        into 'static'
    }
}

task checkFrontend {
    description = 'Check frontend for errors'
    dependsOn frontendTest
}

check.dependsOn checkFrontend 